<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Sumanta Das Bairagya</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#12263A">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--navy:#12263A;--navy-2:#1B3450;--steel:#2F6690;--steel-light:#5C93B8;--rule-navy:#2C4560}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;background:var(--navy);color:#fff;display:grid;place-items:center;
  padding:40px 24px;font-family:'Instrument Sans',system-ui,-apple-system,sans-serif;
  font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(760px 380px at 78% 8%,rgba(92,147,184,.16),transparent 60%)}
.box{max-width:560px;width:100%}
.code{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--steel-light);
  display:block;margin-bottom:18px;letter-spacing:.04em}
h1{font-size:clamp(1.9rem,1.3rem + 2.6vw,2.9rem);line-height:1.12;letter-spacing:-.03em;font-weight:700}
p{color:rgba(255,255,255,.72);margin-top:18px;max-width:46ch}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.btn{display:inline-flex;align-items:center;padding:13px 24px;border-radius:6px;font-size:.92rem;
  font-weight:600;text-decoration:none;border:1px solid transparent;transition:background .16s,border-color .16s}
.btn--solid{background:#fff;color:var(--navy)}
.btn--solid:hover{background:#E4E9ED}
.btn--line{border-color:var(--rule-navy);color:#fff}
.btn--line:hover{border-color:var(--steel-light)}
:focus-visible{outline:2px solid var(--steel-light);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
  <main class="box">
    <span class="code">Error 404</span>
    <h1>That page isn't here.</h1>
    <p>
      The link may be out of date, or it may never have existed. Nothing is broken on
      your end — try the homepage, or just message me and I'll point you at the right thing.
    </p>
    <div class="cta">
      <a class="btn btn--solid" href="/">Back to the homepage</a>
      <a class="btn btn--line" href="/#contact">Say hello</a>
    </div>
  </main>
</body>
</html>
